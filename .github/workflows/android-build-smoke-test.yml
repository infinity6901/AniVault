name: Android Build, Emulator Smoke Test & Report

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.anivault
  MAIN_ACTIVITY: com.anivault/.MainActivity
  REPORT_DIR: ci-report
  DIAG_DIR: diagnostics
  EMULATOR_API: '34'

jobs:
  build-and-smoke-test:
    name: Build APKs, smoke-test on emulator, report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK (ANDROID_HOME) with
      # licenses accepted; android-actions/setup-android was failing while fetching
      # the remote package list, so it is not used. Print what is available instead.
      - name: Show preinstalled Android SDK
        id: sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle (wrapper version, with caching)
        id: gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare folders
        run: mkdir -p "$REPORT_DIR" "$DIAG_DIR" apks

      # The debug signing key is created explicitly so it is guaranteed to exist
      # and so its fingerprint can be checked against both APKs afterwards.
      - name: Ensure Android debug signing key
        id: key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256|Owner'

      - name: Build debug and FOSS release APKs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee "$DIAG_DIR/gradle-build.log"

      - name: Collect and verify APKs (debug-key signature)
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cp app/build/outputs/apk/debug/app-debug.apk apks/AniVault-debug.apk
          cp app/build/outputs/apk/release/app-release.apk apks/AniVault-foss-release.apk
          scripts/verify-apks.sh apks/AniVault-debug.apk apks/AniVault-foss-release.apk 2>&1 | tee "$DIAG_DIR/verify-apks.log"

      # Does not block the emulator test: a lint/unit-test problem should not hide APK/runtime problems.
      - name: Unit tests and lint
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug 2>&1 | tee "$DIAG_DIR/gradle-checks.log"

      - name: Enable KVM for the emulator
        if: steps.verify.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (debug + FOSS release)
        id: smoke
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 3072
          # One line only: the action runs each script line in its own shell.
          script: bash scripts/smoke-test.sh "Debug APK=apks/AniVault-debug.apk" "FOSS release APK=apks/AniVault-foss-release.apk"

      - name: Generate report and log failure causes
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SETUP_OUTCOMES: "JDK=${{ steps.jdk.outcome }} Android-SDK=${{ steps.sdk.outcome }} Gradle=${{ steps.gradle.outcome }} Debug-key=${{ steps.key.outcome }}"
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci-report.sh

      - name: Upload APKs, report, logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anivault-ci-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apks/*.apk
            ci-report/**
            diagnostics/**
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*

      - name: Fail the run if any stage failed
        if: always()
        env:
          OUTCOMES: ${{ steps.jdk.outcome }} ${{ steps.sdk.outcome }} ${{ steps.gradle.outcome }} ${{ steps.key.outcome }} ${{ steps.build.outcome }} ${{ steps.verify.outcome }} ${{ steps.checks.outcome }} ${{ steps.smoke.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Outcomes: $OUTCOMES (job status so far: $JOB_STATUS)"
          if [[ " $OUTCOMES " == *" failure "* || "$JOB_STATUS" == failure ]]; then
            echo '::error::One or more stages failed. See the run summary and ci-report/REPORT.md in the artifact for the cause.'
            exit 1
          fi
