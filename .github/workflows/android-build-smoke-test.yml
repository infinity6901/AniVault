name: Android Build, Emulator Smoke Test & Report

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build APKs and smoke-test on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ID: com.anivault
      MAIN_ACTIVITY: com.anivault/.MainActivity
      REPORT_DIR: ci-report

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare report and diagnostics folders
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR" diagnostics apks
          {
            echo '# AniVault CI Report'
            echo
            printf -- '- **Commit:** `%s`\n' "$GITHUB_SHA"
            printf -- '- **Branch/ref:** `%s`\n' "$GITHUB_REF_NAME"
            echo "- **Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- **Started (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo '- **Signing:** Android-generated debug key for both debug and FOSS release APKs'
            echo
            echo '## Results'
            echo
            echo '| Check | Result | Details |'
            echo '|---|---|---|'
          } > "$REPORT_DIR/REPORT.md"

      - name: Build debug and FOSS release APKs, unit tests, and lint
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug 2>&1 | tee diagnostics/gradle-build.log

      - name: Diagnose build failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Build failure diagnosis'
            echo
            echo 'The Gradle build/test/lint command failed. The complete output is in `diagnostics/gradle-build.log`.'
            echo
            echo '### Likely cause indicators from the log'
            echo '```text'
            grep -Ei -m 25 'What went wrong:|Could not resolve|Could not find|Compilation error|e: file:|Unresolved reference|Duplicate class|Manifest merger failed|SDK location not found|No matching variant|Execution failed for task|FAILURE: Build failed|Caused by:' diagnostics/gradle-build.log || true
            echo '```'
            echo
            echo '### Final Gradle failure section'
            echo '```text'
            tail -n 100 diagnostics/gradle-build.log
            echo '```'
          } >> "$REPORT_DIR/REPORT.md"

      - name: Collect APKs and metadata
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk apks/AniVault-debug.apk
          cp app/build/outputs/apk/release/app-release.apk apks/AniVault-foss-release.apk
          for apk in apks/*.apk; do
            echo "## $(basename "$apk")" >> "$REPORT_DIR/APK-METADATA.md"
            echo >> "$REPORT_DIR/APK-METADATA.md"
            sha256sum "$apk" | tee -a "$REPORT_DIR/APK-METADATA.md"
            echo "Size: $(du -h "$apk" | cut -f1)" >> "$REPORT_DIR/APK-METADATA.md"
            echo >> "$REPORT_DIR/APK-METADATA.md"
          done
          echo '| Build and static checks | PASS | Debug/release APKs, unit tests, and debug lint completed. |' >> "$REPORT_DIR/REPORT.md"

      - name: Emulator smoke test for debug and FOSS release APKs
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -Eeuo pipefail
            mkdir -p diagnostics "$REPORT_DIR"
            run_smoke_test() {
              local apk="$1"
              local label="$2"
              local safe_label="${label//[^a-zA-Z0-9_-]/_}"
              local log="diagnostics/smoke-${safe_label}.log"
              local logcat="diagnostics/logcat-${safe_label}.txt"
              echo "=== Smoke test: ${label} ===" | tee "$log"
              adb wait-for-device
              adb shell getprop sys.boot_completed | grep -q '1'
              adb logcat -c
              adb uninstall "$APP_ID" >/dev/null 2>&1 || true
              if ! adb install "$apk" 2>&1 | tee -a "$log"; then
                adb logcat -d -v threadtime > "$logcat" || true
                echo "FAIL: installation failed for ${label}" | tee -a "$log"
                return 1
              fi
              if ! adb shell am start -W -n "$MAIN_ACTIVITY" 2>&1 | tee -a "$log"; then
                adb logcat -d -v threadtime > "$logcat" || true
                echo "FAIL: launcher activity failed for ${label}" | tee -a "$log"
                return 1
              fi
              sleep 8
              if ! adb shell pidof "$APP_ID" | tr -d '\r' | grep -q '[0-9]'; then
                adb logcat -d -v threadtime > "$logcat" || true
                echo "FAIL: app process did not remain alive for ${label}" | tee -a "$log"
                grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com\.anivault|Fatal signal|am_crash' "$logcat" | tail -n 80 >> "$log" || true
                return 1
              fi
              adb shell dumpsys activity activities > "diagnostics/activities-${safe_label}.txt"
              if ! grep -Fq "$MAIN_ACTIVITY" "diagnostics/activities-${safe_label}.txt"; then
                adb logcat -d -v threadtime > "$logcat" || true
                echo "FAIL: MainActivity not found in activity dump for ${label}" | tee -a "$log"
                grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com\.anivault|Fatal signal|am_crash' "$logcat" | tail -n 80 >> "$log" || true
                return 1
              fi
              adb logcat -d -v threadtime > "$logcat"
              if grep -Fq 'Process: com.anivault' "$logcat" && grep -Eq 'FATAL EXCEPTION|Fatal signal [0-9]' "$logcat"; then
                echo "FAIL: crash markers found for ${label}" | tee -a "$log"
                grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com\.anivault|Fatal signal|am_crash' "$logcat" | tail -n 100 >> "$log" || true
                return 1
              fi
              echo "PASS: installed, launched MainActivity, and process remained alive for ${label}" | tee -a "$log"
              adb shell am force-stop "$APP_ID" || true
            }
            failed=0
            run_smoke_test apks/AniVault-debug.apk 'Debug APK' || failed=1
            run_smoke_test apks/AniVault-foss-release.apk 'FOSS Release APK' || failed=1
            exit "$failed"

      - name: Record smoke-test outcome
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo
            echo '## Emulator smoke tests'
            echo
            if [[ "$BUILD_OUTCOME" != 'success' ]]; then
              echo '| Debug and FOSS release APK smoke tests | SKIPPED | Build did not succeed. See build diagnostics. |'
            elif [[ "$SMOKE_OUTCOME" == 'success' ]]; then
              echo '| Debug APK | PASS | Installed and launched on Android Emulator API 34; process stayed alive. |'
              echo '| FOSS release APK | PASS | Installed and launched on Android Emulator API 34; process stayed alive. |'
            else
              echo '| Emulator smoke tests | FAIL | See `diagnostics/smoke-*.log`, `diagnostics/logcat-*.txt`, and emulator action output. |'
              echo
              echo '### Crash/error indicators'
              echo '```text'
              grep -R -Ei -m 80 'FATAL EXCEPTION|AndroidRuntime|Process: com\.anivault|Fatal signal|am_crash|INSTALL_FAILED|Failure \[' diagnostics || true
              echo '```'
            fi
            echo
            echo "- **Finished (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$REPORT_DIR/REPORT.md"

      - name: Upload APKs, reports, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anivault-ci-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apks/*.apk
            ci-report/**
            diagnostics/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

      - name: Fail workflow if build or emulator tests failed
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [[ "$BUILD_OUTCOME" != 'success' ]]; then
            echo 'CI failed during Gradle build, unit tests, or lint.'
            exit 1
          fi
          if [[ "$SMOKE_OUTCOME" != 'success' ]]; then
            echo 'CI failed during emulator smoke tests.'
            exit 1
          fi
