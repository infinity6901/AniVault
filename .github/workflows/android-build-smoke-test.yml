name: Android Build, Emulator Smoke Test & Report

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub pre-release with the APKs when everything passes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.anivault
  MAIN_ACTIVITY: com.anivault/.MainActivity
  REPORT_DIR: ci-report
  DIAG_DIR: diagnostics
  EMULATOR_API: '34'

# Pipeline:   Plan ─┬─ Gate 1: build + unit tests + lint ─┐
#                   └─ Release APK (R8) ──────────────────┼─ Stage 2: emulator checks ─ QA + failure report ─ Publish GitHub Release
jobs:
  # ── Plan ──────────────────────────────────────────────────────────────────
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # A fixed signing key keeps updates installable over the previous build. It comes from the repository
      # secret ANIVAULT_KEYSTORE_B64 (base64 of the keystore; alias androiddebugkey, password "android").
      # Without the secret (forks, first run) a throw-away key is made and the summary says so.
      - name: Install the signing key (secret, or a throw-away one)
        env:
          KEYSTORE_B64: ${{ secrets.ANIVAULT_KEYSTORE_B64 }}
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home/.android"
          mkdir -p "$ANDROID_USER_HOME" keystore
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
            printf '## Signing key\nUsing the fixed key from the ANIVAULT_KEYSTORE_B64 secret: updates install over earlier builds.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No ANIVAULT_KEYSTORE_B64 secret: signed with a throw-away key, so this APK will not update over a previous install."
            printf '## Signing key\n**Throw-away key** (secret ANIVAULT_KEYSTORE_B64 not set): this build will not install as an update over earlier ones.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          cp "$ANDROID_USER_HOME/debug.keystore" keystore/
      - uses: actions/upload-artifact@v4
        with: { name: ci-keystore, path: keystore/debug.keystore, retention-days: 1 }
      - name: Decide whether this run publishes a release
        id: decide
        run: |
          if [[ "${{ github.ref_type }}" == tag || "${{ inputs.publish }}" == true ]]; then p=true; else p=false; fi
          echo "publish=$p" >> "$GITHUB_OUTPUT"
          {
            echo "## Plan"
            echo "1. **Gate 1** – debug build, unit tests, lint"
            echo "2. **Release APK (R8)** – minified FOSS release build, in parallel"
            echo "3. **Stage 2** – verify signatures of every APK, then emulator smoke test (universal debug + x86_64 release)"
            echo "4. **QA + failure report** – always runs"
            echo "5. **Publish GitHub Release** – this run: \`$p\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Gate 1: build + unit tests + lint ─────────────────────────────────────
  gate1:
    name: "Gate 1: build + unit tests + lint"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build: ${{ steps.build.outcome }}
      checks: ${{ steps.checks.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: ci-keystore, path: keystore }
      - name: Install the shared debug key
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home/.android" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-user-home/.android" "$DIAG_DIR" apks
          cp keystore/debug.keystore "$RUNNER_TEMP/android-user-home/.android/"
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$DIAG_DIR/gradle-build-debug.log"
          ls -l app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-universal-debug.apk apks/AniVault-debug-universal.apk
      - name: Unit tests and lint
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug 2>&1 | tee "$DIAG_DIR/gradle-checks.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apk-debug, path: apks/*.apk, if-no-files-found: ignore, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-gate1
          retention-days: 14
          if-no-files-found: ignore
          path: |
            diagnostics/**
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
      - name: Fail the gate if build or checks failed
        if: steps.build.outcome == 'failure' || steps.checks.outcome == 'failure'
        run: |
          echo "::error::Gate 1 failed (build: ${{ steps.build.outcome }}, tests/lint: ${{ steps.checks.outcome }}). See the QA report."
          exit 1

  # ── Release APK (R8), parallel to Gate 1 ──────────────────────────────────
  release:
    name: Release APK (R8)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: ci-keystore, path: keystore }
      - name: Install the shared debug key
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home/.android" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-user-home/.android" "$DIAG_DIR" apks
          cp keystore/debug.keystore "$RUNNER_TEMP/android-user-home/.android/"
      - name: Build FOSS release APK (minified with R8)
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee "$DIAG_DIR/gradle-build-release.log"
          ls -l app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$f" -release.apk)"; abi="${abi#app-}"
            cp "$f" "apks/AniVault-foss-release-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apk-release, path: apks/*.apk, if-no-files-found: ignore, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-release
          retention-days: 14
          if-no-files-found: ignore
          path: |
            diagnostics/**
            app/build/outputs/mapping/release/mapping.txt

  # ── Stage 2: emulator checks ──────────────────────────────────────────────
  emulator:
    name: "Stage 2: emulator checks"
    needs: [gate1, release]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      verify: ${{ steps.verify.outcome }}
      smoke: ${{ steps.smoke.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: apk-*, path: apks, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: ci-keystore, path: keystore }
      - name: Verify APK signatures (shared debug key)
        id: verify
        run: |
          mkdir -p "$REPORT_DIR" "$DIAG_DIR"
          set -o pipefail
          DEBUG_KEYSTORE="$PWD/keystore/debug.keystore" scripts/verify-apks.sh apks/*.apk 2>&1 | tee "$DIAG_DIR/verify-apks.log"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (debug + FOSS release)
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 3072
          # One line only: the action runs each script line in its own shell.
          script: bash scripts/smoke-test.sh "Debug APK (universal)=apks/AniVault-debug-universal.apk" "FOSS release APK (x86_64)=apks/AniVault-foss-release-x86_64.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-emulator
          retention-days: 14
          if-no-files-found: ignore
          path: |
            diagnostics/**
            ci-report/**
      - name: Fail the stage if the smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Emulator smoke test failed. See the QA report."
          exit 1

  # ── QA + failure report (always) ──────────────────────────────────────────
  report:
    name: QA + failure report
    needs: [plan, gate1, release, emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: diag-*, path: ., merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: apk-*, path: apks, merge-multiple: true }
      - name: Generate report and log failure causes
        env:
          BUILD_OUTCOME: ${{ (needs.gate1.outputs.build == 'failure' || needs.release.result == 'failure') && 'failure' || (needs.gate1.outputs.build || 'skipped') }}
          VERIFY_OUTCOME: ${{ needs.emulator.outputs.verify }}
          CHECKS_OUTCOME: ${{ needs.gate1.outputs.checks }}
          SMOKE_OUTCOME: ${{ needs.emulator.outputs.smoke }}
          SETUP_OUTCOMES: "Plan=${{ needs.plan.result }}"
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: |
          mkdir -p "$DIAG_DIR"
          cat "$DIAG_DIR"/gradle-build-*.log > "$DIAG_DIR/gradle-build.log" 2>/dev/null || true
          scripts/ci-report.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "anivault-apks-${{ github.run_number }}", path: apks/*.apk, if-no-files-found: warn, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "anivault-reports-${{ github.run_number }}"
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci-report/**
            diagnostics/**
            app/build/**
      - name: Fail the run if any stage failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '::error::One or more stages failed. See the run summary and ci-report/REPORT.md in the artifact for the cause.'
          exit 1

  # ── Publish GitHub Release ────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [plan, report]
    if: needs.plan.outputs.publish == 'true' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: apk-*, path: apks, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref_type }}" == tag ]]; then
            gh release create "${{ github.ref_name }}" apks/*.apk --title "AniVault ${{ github.ref_name }}" --generate-notes
          else
            gh release create "v1.1.0-ci.${{ github.run_number }}" apks/*.apk --prerelease --target "${{ github.sha }}" \
              --title "AniVault CI build #${{ github.run_number }}" \
              --notes "Debug-signed FOSS builds (one APK per architecture: arm64-v8a is right for most phones; universal works everywhere) from commit ${{ github.sha }}. Not for the Play Store."
          fi
