[versions]
agp                  = "8.4.2"
kotlin               = "1.9.24"
ksp                  = "1.9.24-1.0.20"
hilt                 = "2.51.1"
hiltNavigationCompose = "1.2.0"
room                 = "2.6.1"
compose-bom          = "2024.05.00"
lifecycle            = "2.7.0"
coil                 = "2.7.0"
okhttp               = "4.12.0"
retrofit             = "2.11.0"
jsoup                = "1.17.2"
jspecify             = "1.0.0"
biometric            = "1.1.0"
datastore            = "1.1.1"
sqlcipher             = "4.5.4"
sqlite                = "2.4.0"
coroutines           = "1.8.1"
core-ktx             = "1.13.1"
activity-compose     = "1.9.0"
navigation-compose   = "2.7.7"
fragment             = "1.6.2"
work                 = "2.9.0"
junit                = "4.13.2"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",           name = "core-ktx",              version.ref = "core-ktx" }
androidx-activity-compose   = { group = "androidx.activity",       name = "activity-compose",       version.ref = "activity-compose" }
androidx-navigation-compose = { group = "androidx.navigation",      name = "navigation-compose",      version.ref = "navigation-compose" }
androidx-fragment-ktx       = { group = "androidx.fragment",        name = "fragment-ktx",            version.ref = "fragment" }

# Compose BOM
compose-bom                 = { group = "androidx.compose",        name = "compose-bom",            version.ref = "compose-bom" }
compose-ui                  = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-ext  = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle
lifecycle-runtime-compose   = { group = "androidx.lifecycle",      name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }

# Room
room-runtime                = { group = "androidx.room",           name = "room-runtime",          version.ref = "room" }
room-ktx                    = { group = "androidx.room",           name = "room-ktx",              version.ref = "room" }
room-compiler               = { group = "androidx.room",           name = "room-compiler",         version.ref = "room" }

# Hilt
hilt-android                = { group = "com.google.dagger",       name = "hilt-android",          version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",       name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",           name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Network
okhttp                      = { group = "com.squareup.okhttp3",    name = "okhttp",                version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",    name = "logging-interceptor",   version.ref = "okhttp" }
retrofit                    = { group = "com.squareup.retrofit2",  name = "retrofit",              version.ref = "retrofit" }
retrofit-gson               = { group = "com.squareup.retrofit2",  name = "converter-gson",        version.ref = "retrofit" }
jsoup                       = { group = "org.jsoup",               name = "jsoup",                 version.ref = "jsoup" }
jspecify                    = { group = "org.jspecify",             name = "jspecify",              version.ref = "jspecify" }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test             = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# WorkManager
work-runtime-ktx            = { group = "androidx.work",           name = "work-runtime-ktx",      version.ref = "work" }

# Test
junit                       = { group = "junit",                   name = "junit",                 version.ref = "junit" }

# Coil
coil-compose                = { group = "io.coil-kt",              name = "coil-compose",          version.ref = "coil" }

# Biometrics
biometric                   = { group = "androidx.biometric",      name = "biometric",             version.ref = "biometric" }

# DataStore
datastore-preferences       = { group = "androidx.datastore",      name = "datastore-preferences", version.ref = "datastore" }
sqlcipher                   = { group = "net.zetetic",               name = "android-database-sqlcipher", version.ref = "sqlcipher" }
sqlite-ktx                  = { group = "androidx.sqlite",           name = "sqlite-ktx", version.ref = "sqlite" }

[plugins]
android-application = { id = "com.android.application",    version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",     version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
